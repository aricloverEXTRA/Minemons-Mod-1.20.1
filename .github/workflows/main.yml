name: Codex Automated PR Fixer

on:
  issue_comment:
    types: [created]

jobs:
  execute-code-changes:
    if: |
      github.event.issue.pull_request && 
      startsWith(github.event.comment.body, '@codex')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Get PR Branch Context
        uses: xt0rted/pull-request-comment-branch@v3
        id: comment-branch

      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref }}

      # SAFE STEP: Writes the comment body directly to a file to prevent shell interpretation
      - name: Parse Action Prompt Safely
        id: parse
        env:
          RAW_PROMPT: ${{ github.event.comment.body }}
        run: |
          cat << 'EOF' > user_prompt.txt
          ${{ env.RAW_PROMPT }}
          EOF
          # Remove the '@codex' trigger phrase from the text file
          sed -i 's/^@codex//g' user_prompt.txt

      - name: Run Codex Execution
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: unsafe
          # Read the clean prompt directly out of the text file
          prompt: |
            You are a senior Minecraft developer operating directly inside the project workspace.
            Your objective: Modify the files in this workspace to directly fulfill the user's request.
            
            User Request:
            $(cat user_prompt.txt)
            
            Instructions:
            - Rewrites, refactors, or new classes must be directly saved to their respective file paths.
            - Ensure code adheres to standard Java structure for Minecraft modding.
            - Do not output text conversations; directly apply the filesystem edits.

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🤖 Codex: Auto-applied changes from PR comment"
            git push origin HEAD:${{ steps.comment-branch.outputs.head_ref }}
          else
            echo "No files were modified by the prompt."
          fi

      - name: Confirm Execution
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Codex Execution Complete:** Prompt parsed safely. I have modified the files and pushed the fixes straight to your branch!`
            });
