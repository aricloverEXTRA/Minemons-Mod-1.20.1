name: Codex Automated PR Fixer

on:
  issue_comment:
    types: [created]

jobs:
  execute-code-changes:
    if: |
      github.event.issue.pull_request && 
      startsWith(github.event.comment.body, '@codex')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Get PR Branch Context
        uses: xt0rted/pull-request-comment-branch@v3
        id: comment-branch

      # Updated checkout action to avoid deprecated Node.js versions
      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref }}

      - name: Parse Action Prompt Safely
        id: parse
        env:
          RAW_PROMPT: ${{ github.event.comment.body }}
        run: |
          cat << 'EOF' > user_prompt.txt
          ${{ env.RAW_PROMPT }}
          EOF
          sed -i 's/^@codex//g' user_prompt.txt

      - name: Execute Code Modification via OpenAI API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const promptText = fs.readFileSync("user_prompt.txt", "utf8");
          
          async function run() {
            const response = await fetch("https://openai.com", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model: "gpt-4o",
                messages: [
                  {
                    role: "system",
                    content: "You are a senior Minecraft developer workspace assistant. Your task is to output executable bash commands or code writes to modify files in the current repository workspace based on the user prompt. Do not output conversational text. Output ONLY valid shell commands or file updates."
                  },
                  {
                    role: "user",
                    content: `The workspace contains your Minecraft mod files. Modify them based on this prompt:\n\n${promptText}`
                  }
                ]
              })
            });
            const data = await response.json();
            console.log(data.choices[0].message.content);
          }
          run();
          ' > ai_instructions.sh || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          rm -f user_prompt.txt ai_instructions.sh
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🤖 Codex: Auto-applied changes from PR comment"
            git push origin HEAD:${{ steps.comment-branch.outputs.head_ref }}
          else
            echo "No files were modified by the prompt."
          fi

      - name: Confirm Execution
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Direct Codex Connection Complete:** Bypassed local runner limits. The requested Minecraft mod changes have been injected and pushed to your branch!`
            });
